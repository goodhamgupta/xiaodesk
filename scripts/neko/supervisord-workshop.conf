[program:workshop-services]
environment=HOME="/home/neko",USER="neko",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="/tmp/runtime-neko",NEKO_VNC_PORT="%(ENV_NEKO_VNC_PORT)s",CUA_DRIVER_PERMISSION_MODE="%(ENV_CUA_DRIVER_PERMISSION_MODE)s"
command=/workspace/scripts/neko/container-services.sh
autorestart=true
startsecs=2
priority=900
user=neko
stdout_logfile=/var/log/neko/workshop-services.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
