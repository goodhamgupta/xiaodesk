          type: api_response
          endpoint: /booking/api/reservations?guest_email=nina.patel@example.com
          expected:
            count: 1
            reservations:
              - party_size: 20
                date: "2024-03-17"
                has_accessibility: 1
                price_per_hour_lte: 200
