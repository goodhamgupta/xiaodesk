pack: booking
name: Constrained Booking Tasks
description: |
  Search venues under date, party size, max price, and accessibility constraints, then confirm a reservation.
  booking-008 pre-marks the cheapest accessible slot sold out so the agent must pick another slot (retry / backoff).

jobs:
  - id: booking-001
    name: Accessible party of 40
    description: Book an accessible venue for 40 guests under $300/hr on 2024-03-15
    goal: |
      Book a venue on 2024-03-15 for 40 guests, max price $300 per hour, accessibility required.
      Guest name: Priya Shah, email priya.shah@example.com.
    params:
      date: "2024-03-15"
      party_size: 40
      max_price: 300
      accessibility: true
      guest_name: Priya Shah
      guest_email: priya.shah@example.com
    eval:
      type: composite
      checks:
        - name: reservation_exists
          type: api_response
          endpoint: /booking/api/reservations?guest_email=priya.shah@example.com
          expected:
            count: 1
            reservations:
              - guest_email: priya.shah@example.com
                party_size: 40
                date: "2024-03-15"
                confirmed: 1
                has_accessibility: 1
                price_per_hour_lte: 300

  - id: booking-002
    name: Small private dinner
    description: Book any venue for 12 guests on 2024-03-16, no price cap
    goal: |
      Book a venue on 2024-03-16 for 12 guests. No accessibility requirement and no max price.
      Guest name: Luis Ortega, email luis.ortega@example.com.
    params:
      date: "2024-03-16"
      party_size: 12
      guest_name: Luis Ortega
      guest_email: luis.ortega@example.com
    eval:
      type: composite
      checks:
        - name: reservation_exists
          type: api_response
          endpoint: /booking/api/reservations?guest_email=luis.ortega@example.com
          expected:
            count: 1
            reservations:
              - guest_email: luis.ortega@example.com
                party_size: 12
                date: "2024-03-16"
                confirmed: 1

