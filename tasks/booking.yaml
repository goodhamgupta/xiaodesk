  - id: booking-008
    name: Sold-out first slot retry
    description: |
      The cheapest accessible slot on 2024-03-18 for a party of 20 is marked unavailable
      after the search page renders, forcing the agent to back off and pick the next slot.
    goal: |
      Book an accessible venue on 2024-03-18 for 20 guests, max $220 per hour.
      If the first slot you click is sold out, go back and choose another slot that still satisfies the constraints.
      Guest name: Taylor Nguyen, email taylor.nguyen@example.com.
    setup:
      force_slot_race: true
    params:
      date: "2024-03-18"
      party_size: 20
      max_price: 220
      accessibility: true
      guest_name: Taylor Nguyen
      guest_email: taylor.nguyen@example.com
      force_slot_race: true
    eval:
      type: composite
      checks:
        - name: retry_reservation
          type: api_response
          endpoint: /booking/api/reservations?guest_email=taylor.nguyen@example.com
          expected:
            count: 1
            reservations:
              - party_size: 20
                date: "2024-03-18"
                has_accessibility: 1
                price_per_hour_lte: 220
                confirmed: 1
