pack: onboarding
name: Portal Onboarding Tasks
description: |
  Multi-step signup: registration, plan selection, terms, welcome page, welcome PDF.
  Each job uses a unique persona. Pass if the user row, session, and welcome download exist.

jobs:
  - id: onboarding-001
    name: Basic Free Plan Signup
    description: Complete signup flow with free plan selection
    goal: |
      Open the onboarding portal. Sign up as Alice Johnson (alice.johnson@example.com),
      choose the Free plan, accept the terms, and download the welcome PDF.
    params:
      name: Alice Johnson
      email: alice.johnson@example.com
      plan: free
    eval:
      type: composite
      checks:
        - name: user_created
          type: db_row_matches
          table: users
          where: { email: alice.johnson@example.com }
          expected: { name: Alice Johnson, plan: free, terms_accepted_at: "*" }
        - name: session_created
          type: db_query
          query: SELECT s.id FROM sessions s JOIN users u ON u.id = s.user_id WHERE u.email = ?
          params: [alice.johnson@example.com]
          expected_min_rows: 1
        - name: welcome_downloaded
          type: db_query
          query: SELECT wd.id FROM welcome_downloads wd JOIN users u ON u.id = wd.user_id WHERE u.email = ? AND wd.filename = 'welcome-guide.pdf'
          params: [alice.johnson@example.com]
          expected_min_rows: 1

